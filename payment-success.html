<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Payment Confirmation | House of Kagendo
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<section
    class="min-vh-100
           d-flex
           align-items-center
           justify-content-center"
>

    <div
        class="container
               text-center"
    >

        <div
            id="paymentStatus"
            class="mx-auto"
            style="max-width:600px;"
        >

            <h2>
                Verifying Your Payment...
            </h2>

            <p>
                Please wait while we confirm
                your payment securely.
            </p>

        </div>

    </div>

</section>


<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script>

const API_URL =
window.location.hostname === "127.0.0.1" ||
window.location.hostname === "localhost"

? "http://127.0.0.1:5050"

: "https://house-of-kagendo.onrender.com";


async function verifyPayment() {

    const statusContainer =
        document.getElementById(
            "paymentStatus"
        );


    // Paystack normally returns the
    // transaction reference in the URL.

    const params =
        new URLSearchParams(
            window.location.search
        );


    const reference =
        params.get("reference") ||
        params.get("trxref") ||
        localStorage.getItem(
            "paystackReference"
        );


    if (!reference) {

        statusContainer.innerHTML = `

            <h2>
                Payment Could Not Be Verified
            </h2>

            <p>
                We could not find your payment reference.
                Please contact House of Kagendo if
                payment was deducted.
            </p>

            <a
                href="index.html"
                class="btn btn-dark mt-3"
            >

                Return Home

            </a>

        `;

        return;

    }


    try {

        const response =
            await fetch(

                `${API_URL}/payments/paystack/verify/${encodeURIComponent(reference)}`

            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(

                data.message ||
                "Payment verification failed."

            );

        }


        // Clear cart ONLY after verified payment

        localStorage.removeItem(
            "cart"
        );

        localStorage.removeItem(
            "checkoutProduct"
        );

        localStorage.removeItem(
            "checkoutOrder"
        );

        localStorage.removeItem(
            "pendingOrder"
        );

        localStorage.removeItem(
            "paystackReference"
        );


        const order =
            data.order;


        statusContainer.innerHTML = `

            <div
                style="
                    font-size:60px;
                    margin-bottom:20px;
                "
            >

                ✓

            </div>


            <h2>
                Payment Successful
            </h2>


            <p class="mt-3">

                Thank you for shopping with
                House of Kagendo.

            </p>


            <p>

                Your order has been confirmed.

            </p>


            <div
                class="mt-4 p-4 border"
            >

                <p class="mb-1">

                    Order Number

                </p>


                <h4>

                    ${order.orderNumber}

                </h4>


                <p class="mt-3 mb-0">

                    Total:
                    <strong>

                        KES
                        ${Number(
                            order.total
                        ).toLocaleString()}

                    </strong>

                </p>

            </div>


            <a
                href="index.html"
                class="btn btn-dark mt-4"
            >

                Continue Shopping

            </a>

        `;


    } catch (error) {

        console.error(
            "Payment verification:",
            error
        );


        statusContainer.innerHTML = `

            <h2>
                Payment Verification Pending
            </h2>


            <p>

                ${error.message}

            </p>


            <p>

                If money was deducted,
                do not make another payment immediately.
                Your order can still be checked
                using your payment reference.

            </p>


            <a
                href="index.html"
                class="btn btn-dark mt-3"
            >

                Return Home

            </a>

        `;

    }

}


verifyPayment();

</script>


</body>

</html>
