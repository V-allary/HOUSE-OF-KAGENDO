<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>House of Kagendo | Admin Login</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body class="admin-login-body">

<div class="admin-overlay">

<div class="admin-login-card">

<div class="admin-logo">

<img
src="KA img/House Of Ka Log.jpg"
alt="House of Kagendo">

<h2>

House of Kagendo

</h2>

<p>

Admin Portal

</p>

</div>

<form id="adminLoginForm">

<div class="mb-4">

<label class="form-label">

Email Address

</label>

<input
type="email"
id="adminEmail"
class="form-control"
placeholder="admin@houseofka.com"
required>

</div>

<div class="mb-4">

<label class="form-label">

Password

</label>

<div class="password-box">

<input
type="password"
id="adminPassword"
class="form-control"
placeholder="Enter Password"
required>

<i
class="bi bi-eye-slash"
id="togglePassword">

</i>

</div>

</div>

<button
type="submit"
class="admin-login-btn">

<i class="bi bi-shield-lock-fill"></i>

Login to Dashboard

</button>

<p
id="loginError"
class="login-error">

</p>

</form>

</div>

</div>

<script src="admin.js"></script>

</body>

</html>
