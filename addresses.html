    <script>

        const token =
        localStorage.getItem("token");
        
        const user =
        JSON.parse(
        localStorage.getItem("user")
        );
        
        if(!token || !user){
        
        window.location.href =
        "login.html";
        
        }
        
        let addresses =
        JSON.parse(
        localStorage.getItem("addresses")
        ) || [];
        
        const list =
        document.getElementById(
        "address-list"
        );
        
        function displayAddresses(){
        
        list.innerHTML = "";
        
        if(addresses.length===0){
        
        list.innerHTML=`
        
        <div class="empty-orders">
        
        <i class="bi bi-geo-alt"></i>
        
        <h3>
        
        No Address Saved
        
        </h3>
        
        <p>
        
        Save a delivery address for faster checkout.
        
        </p>
        
        </div>
        
        `;
        
        return;
        
        }
        
        addresses.forEach((address,index)=>{
        
        list.innerHTML += `
        
        <div class="order-card">
        
        <h5>
        
        ${address.name}
        
        </h5>
        
        <p>
        
        ${address.phone}
        
        </p>
        
        <p>
        
        ${address.address}
        
        </p>
        
        <button
        class="remove-btn"
        onclick="deleteAddress(${index})">
        
        Delete
        
        </button>
        
        </div>
        
        `;
        
        });
        
        }
        
        displayAddresses();
        
        document
        .getElementById("add-address")
        .addEventListener("click",()=>{
        
        const name =
        prompt("Recipient Name");
        
        if(!name) return;
        
        const phone =
        prompt("Phone Number");
        
        if(!phone) return;
        
        const address =
        prompt("Delivery Address");
        
        if(!address) return;
        
        addresses.push({
        
        name,
        
        phone,
        
        address
        
        });
        
        localStorage.setItem(
        
        "addresses",
        
        JSON.stringify(addresses)
        
        );
        
        displayAddresses();
        
        });
        
        function deleteAddress(index){
        
        addresses.splice(index,1);
        
        localStorage.setItem(
        
        "addresses",
        
        JSON.stringify(addresses)
        
        );
        
        displayAddresses();
        
        }
        
        </script>
