     <!-- JS -->

   <script src="products.js"></script>
   <script src="main.js"></script>



    
    <script>
    
    const orders =
    JSON.parse(localStorage.getItem("orders")) || [];
    
    const container =
    document.getElementById("orders-container");
    
    if(orders.length === 0){
    
    container.innerHTML=`
    
    <div class="empty-orders">
    
    <i class="bi bi-bag-x"></i>
    
    <h2>No Orders Yet</h2>
    
    <p>
    
    Once you place your first order it will appear here.
    
    </p>
    
    <a href="shop.html" class="shop-btn">
    
    Continue Shopping
    
    </a>
    
    </div>
    
    `;
    
    }else{
    
    orders.reverse().forEach(order=>{
    
    container.innerHTML += `
    
    <div class="order-card">
    
    <div class="order-top">
    
    <div>
    
    <h5>Order #${order.orderNumber}</h5>
    
    <p>${order.date}</p>
    
    </div>
    
    <span class="status">
    
    ${order.status}
    
    </span>
    
    </div>
    
    <div class="order-total">
    
    KES ${order.total}
    
    </div>
    
    </div>
    
    `;
    
    });
    
    }
    
    </script>
