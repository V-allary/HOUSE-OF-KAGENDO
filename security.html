<script>

const token =
localStorage.getItem("token");

const user =
JSON.parse(
localStorage.getItem("user")
);

if(!token || !user){

    window.location.href =
    "login.html";

}

document.getElementById(
"userEmail"
).value =
user.email;

document
.getElementById("changePassword")
.addEventListener("click",()=>{

const current =
document.getElementById(
"currentPassword"
).value;

const password =
document.getElementById(
"newPassword"
).value;

const confirm =
document.getElementById(
"confirmPassword"
).value;

if(password !== confirm){

alert(

"Passwords do not match."

);

return;

}

alert(

"Password update will be connected to the server in the next step."

);

});

function logout(){

localStorage.removeItem("token");

localStorage.removeItem("user");

window.location.href =
"index.html";

}

</script>
