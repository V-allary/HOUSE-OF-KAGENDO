<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        My Account | House of Kagendo
    </title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="style.css">

</head>

<body>

    <section class="luxury-breadcrumb">

        <div class="container">
    
            <div class="breadcrumb-wrapper">
    
                <!-- HOME -->
                <a href="index.html" class="breadcrumb-home">
    
                    <i class="bi bi-house-door"></i>
    
                </a>
    
                <i class="bi bi-chevron-right"></i>
    
                <!-- CATEGORY -->
                <span class="breadcrumb-category">
    
                    Account
    
                </span>
    
                <i class="bi bi-chevron-right"></i>
    
                <!-- PRODUCT -->
                <span id="breadcrumb-product"
                    class="breadcrumb-product">
    
                    House of Kagendo
    
                </span>
    
            </div>
    
        </div>
    

        <section class="account-section">

            <div class="container account-container">
        
                <div class="account-top">
        
                    <div class="account-avatar">
        
                        <i class="bi bi-person"></i>
        
                    </div>
        
                    <h2 id="account-name">
        
                        Welcome
        
                    </h2>
        
                    <p id="account-email">
        
                        customer@email.com
        
                    </p>
        
                    <p class="account-subtitle">
        
                        Manage your House of Kagendo account.
        
                    </p>
        
                </div>
        
                <div class="account-menu">
        
                    <a href="orders.html" class="account-item">
        
                        <i class="bi bi-bag"></i>
        
                        <div>
        
                            <h5>My Orders</h5>
        
                            <span>Track and view purchases</span>
        
                        </div>
        
                        <i class="bi bi-chevron-right"></i>
        
                    </a>
        
                    <a href="wishlist.html" class="account-item">
        
                        <i class="bi bi-heart"></i>
        
                        <div>
        
                            <h5>Wishlist</h5>
        
                            <span>Your favourite products</span>
        
                        </div>
        
                        <i class="bi bi-chevron-right"></i>
        
                    </a>
        
                    <a href="cart.html" class="account-item">
        
                        <i class="bi bi-cart3"></i>
        
                        <div>
        
                            <h5>Saved Cart</h5>
        
                            <span>Continue shopping</span>
        
                        </div>
        
                        <i class="bi bi-chevron-right"></i>
        
                    </a>
        
                    <a href="addresses.html" class="account-item">
        
                        <i class="bi bi-geo-alt"></i>
        
                        <div>
        
                            <h5>Shipping Addresses</h5>
        
                            <span>Manage deliveries</span>
        
                        </div>
        
                        <i class="bi bi-chevron-right"></i>
        
                    </a>
        
                    <a href="profile.html" class="account-item">
        
                        <i class="bi bi-person-vcard"></i>
        
                        <div>
        
                            <h5>Account Details</h5>
        
                            <span>Edit your information</span>
        
                        </div>
        
                        <i class="bi bi-chevron-right"></i>
        
                    </a>
        
                    <a href="security.html" class="account-item">
        
                        <i class="bi bi-shield-lock"></i>
        
                        <div>
        
                            <h5>Security</h5>
        
                            <span>Password & privacy</span>
        
                        </div>
        
                        <i class="bi bi-chevron-right"></i>
        
                    </a>
        
                </div>
        
                <button onclick="logout()" class="logout-btn">
        
                    Logout
        
                </button>
        
            </div>
        
        </section>
    <script>

        const token =
        localStorage.getItem("token");
        
        const user =
        JSON.parse(
            localStorage.getItem("user")
        );
        
        if(!token || !user){
        
            window.location.href =
            "login.html";
        
        }else{
        
            document.getElementById(
                "account-name"
            ).innerText =
            "Welcome back, " +
            user.firstName + " 👋";
        
            document.getElementById(
                "account-email"
            ).innerText =
            user.email;
        
        }
        
        // WISHLIST COUNT
        
        const wishlist =
        JSON.parse(
            localStorage.getItem("wishlist")
        ) || [];
        
        document.getElementById(
            "wishlist-count"
        ).innerText =
        wishlist.length + " Items";
        
        // CART COUNT
        
        const cart =
        JSON.parse(
            localStorage.getItem("cart")
        ) || [];
        
        let totalCart = 0;
        
        cart.forEach(item=>{
        
            totalCart += item.quantity;
        
        });
        
        document.getElementById(
            "cart-count"
        ).innerText =
        totalCart + " Items";
        
        // ORDERS
        
        const orders =
        JSON.parse(
            localStorage.getItem("orders")
        ) || [];
        
        document.getElementById(
            "orders-count"
        ).innerText =
        orders.length + " Orders";
        
        // LOGOUT
        
        function logout(){
        
            localStorage.removeItem("token");
            localStorage.removeItem("user");
        
            window.location.href =
            "index.html";
        
        }
        
        </script>
    </body>
    
    </html>
